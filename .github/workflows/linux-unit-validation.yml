# SPDX-License-Identifier: Apache-2.0
# Bounded source/package checks, not live-provider qualification.
name: linux-unit-validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-unit-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      UV_PYTHON: '3.12.14'
      UV_PYTHON_DOWNLOADS: never
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
      # Inherited by the installed-wheel test fixtures' isolated uv builds.
      UV_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/requirements/linux-unit.txt
    steps:
      - name: Checkout P11Lab
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'

      - name: Install pinned test environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/python -m pip install --disable-pip-version-check --no-deps uv==0.12.23
          .venv/bin/uv pip install --python .venv/bin/python --no-deps --only-binary :all: -r .github/requirements/linux-unit.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          source = json.loads(Path("src/p11lab/data/tools.json").read_text())["tools"]["checker"]["source"]
          assert source["kind"] == "git"
          Path(os.environ["RUNNER_TEMP"], "checker-requirement.txt").write_text(
              f"pkcs11-check @ git+{source['url']}@{source['revision']}\n"
          )
          PY
          .venv/bin/uv pip install --python .venv/bin/python --no-deps --no-build-isolation -r "$RUNNER_TEMP/checker-requirement.txt" .
          .venv/bin/uv pip check --python .venv/bin/python

      - name: Verify checker provenance
        run: |
          python - <<'PY'
          import json
          import sys
          from importlib import metadata
          from pathlib import Path
          import pkcs11_check.testcases
          import pkcs11_check.provenance
          source = json.loads(Path("src/p11lab/data/tools.json").read_text())["tools"]["checker"]["source"]
          direct = json.loads(metadata.distribution("pkcs11-check").read_text("direct_url.json"))
          assert sys.version_info[:3] == (3, 12, 14), sys.version
          assert metadata.version("pkcs11-check") == "0.2.2"
          assert direct["url"] == source["url"]
          assert direct["vcs_info"]["vcs"] == "git"
          assert direct["vcs_info"]["commit_id"] == source["revision"]
          print("Python", sys.version)
          print("pkcs11-check", metadata.version("pkcs11-check"), direct)
          PY
          uv --version
          uv pip freeze --python .venv/bin/python
          for tool in bash gcc cc openssl; do
            command -v "$tool"
          done

      - name: Run full pytest suite
        run: |
          python -m pytest -ra --junitxml="$RUNNER_TEMP/p11lab-tests.xml"

      - name: Summarize results and limitations
        if: always()
        run: |
          python - <<'PY'
          from collections import Counter
          from html import escape
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          lines = [
              "## Bounded Linux validation",
              "Source/package tests only: not provider runtime qualification.",
              "Live-provider tests retain their existing explicit-input gates.",
              "Skipped tests are missing runtime evidence, not passing observations.",
          ]
          report = Path(os.environ["RUNNER_TEMP"], "p11lab-tests.xml")
          if not report.is_file():
              lines.append("No pytest report was produced; this is not a pass.")
          else:
              root = ET.parse(report).getroot()
              counts = Counter()
              for suite in root.iter("testsuite"):
                  counts.update({key: int(suite.get(key, "0")) for key in ("tests", "failures", "errors", "skipped")})
              lines.append("{tests} tests, {failures} failures, {errors} errors, {skipped} skipped.".format(**counts))
              reasons = Counter(node.get("message", "unspecified skip reason") for node in root.iter("skipped"))
              lines.extend(f"- {count} skipped: {escape(reason).replace(chr(10), ' ')}" for reason, count in sorted(reasons.items()))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("\n".join(lines) + "\n")
          PY
