# SPDX-License-Identifier: Apache-2.0
# Reusable P11Lab application run. Fetches a handoff by immutable digest and
# runs the caller application through `p11lab run` only. The host environment
# and publisher credentials are never forwarded into providers: the child
# receives OS essentials plus only the declared provider inputs (pass
# credentials by file path, never inline). The application exit code
# propagates unchanged, and receipts are collected even on failure.
name: 'p11lab run'
description: 'Run a caller application against a pinned P11Lab provider handoff.'

inputs:
  environment:
    description: 'Catalogue environment ID (e.g. softhsm2).'
    required: true
  channel:
    description: 'Locked channel: release or rolling.'
    required: true
  mode:
    description: 'Execution mode: direct or native.'
    required: false
    default: 'direct'
  registry:
    description: 'Registry package holding the handoff.'
    required: false
    default: 'ghcr.io/mingulov/p11lab'
  handoff-digest:
    description: 'Immutable handoff digest (sha256:<hex>).'
    required: true
  command:
    description: 'Application argv as a JSON array of strings.'
    required: true
  inputs:
    description: 'Newline-separated NAME=VALUE provider inputs.'
    required: false
    default: ''
  state-dir:
    description: 'Caller-owned persistent state directory (else ephemeral).'
    required: false
    default: ''
  timeout:
    description: 'Run timeout in seconds.'
    required: false
    default: '300'
  working-directory:
    description: 'Caller application cwd, relative to the caller checkout.'
    required: false
    default: '.'

outputs:
  exit-code:
    description: 'Exit code of the p11lab run (application failures preserved).'
    value: ${{ steps.collect.outputs['exit-code'] }}
  app-returncode:
    description: 'Application return code from the receipt, when recorded.'
    value: ${{ steps.collect.outputs['app-returncode'] }}
  receipt-path:
    description: 'Path of the run receipt.'
    value: ${{ steps.collect.outputs['receipt-path'] }}
  handoff-sha256:
    description: 'SHA-256 of the fetched handoff bytes.'
    value: ${{ steps.collect.outputs['handoff-sha256'] }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5

      with:
        python-version: '3.12'

    - name: Install P11Lab from the action revision
      shell: bash
      run: python -m pip install "${{ github.action_path }}"

    - name: Install pinned ORAS (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        out="$RUNNER_TEMP/p11lab-oras"
        bash "${{ github.action_path }}/src/p11lab/data/delivery/install-oras.sh" --output-dir "$out"
        echo "$out" >> "$GITHUB_PATH"
        echo "P11LAB_ORAS=$out/oras" >> "$GITHUB_ENV"

    - name: Install pinned ORAS (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $out = Join-Path $env:RUNNER_TEMP 'p11lab-oras'
        $exe = & "${{ github.action_path }}/src/p11lab/data/delivery/install-oras.ps1" -OutputDir $out
        if ($LASTEXITCODE) { throw "ORAS install failed" }
        Add-Content $env:GITHUB_PATH (Split-Path $exe)
        Add-Content $env:GITHUB_ENV "P11LAB_ORAS=$exe"

    - name: Run the caller application
      id: run
      shell: bash
      run: |
        python "${{ github.action_path }}/src/p11lab/data/delivery/action-run.py" \
          --environment "${{ inputs.environment }}" \
          --channel "${{ inputs.channel }}" \
          --mode "${{ inputs.mode }}" \
          --registry "${{ inputs.registry }}" \
          --handoff-digest "${{ inputs.handoff-digest }}" \
          --command "${{ inputs.command }}" \
          --inputs "${{ inputs.inputs }}" \
          --state-dir "${{ inputs.state-dir }}" \
          --timeout "${{ inputs.timeout }}" \
          --working-directory "${{ github.workspace }}/${{ inputs.working-directory }}" \
          --oras "$P11LAB_ORAS" \
          --run-dir "$RUNNER_TEMP/p11lab-run"

    - name: Collect receipts
      id: collect
      if: always()
      shell: bash
      run: |
        f="$RUNNER_TEMP/p11lab-run/action-outputs.env"
        if [ -f "$f" ]; then
          while IFS='=' read -r k v; do
            [ -n "$k" ] || continue
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done < "$f"
        else
          echo "exit-code=1" >> "$GITHUB_OUTPUT"
        fi
