<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- P11Lab-origin private per-shard bus for the tpm2 provider. Anonymous
     auth is required because the runtime user has no passwd entry, so the
     EXTERNAL mechanism cannot authenticate it. This bus is owned by the
     supervisor under /run/p11lab/tpm2 and is never the host bus. -->
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/p11lab/tpm2/bus/system_bus_socket</listen>
  <auth>ANONYMOUS</auth>
  <allow_anonymous/>
  <policy context="default">
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
</busconfig>
