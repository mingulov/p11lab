[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "p11lab"
version = "0.1.0.dev0"
description = "Reproducible PKCS#11 provider environments"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
p11lab = "p11lab.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/p11lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
